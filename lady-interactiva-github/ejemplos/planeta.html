<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pequeñas acciones, gran planeta · Lady Interactiva</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f4fb;color:#192c47;font:18px/1.6 Arial,sans-serif}main{max-width:760px;margin:40px auto;padding:32px;background:white;border-radius:20px}h1{font-size:2.4rem;line-height:1.1}h2{font-size:1.3rem}small{color:#506079}button{font:inherit;border:1px solid #cbd5e7;padding:12px 18px;border-radius:10px;background:#fff;color:#192c47;cursor:pointer;margin:6px 0;text-align:left}button:hover,button:focus-visible{border-color:#234bec;background:#edf1ff}button:disabled{cursor:default;opacity:.65}.answers{display:grid;gap:8px}.feedback{background:#edf3df;padding:15px;border-radius:10px;margin:18px 0}.next{background:#234bec;color:#fff}progress{width:100%;accent-color:#234bec}a{color:#234bec}footer{margin-top:32px;border-top:1px solid #ddd;padding-top:15px;font-size:.85rem}@media(max-width:600px){main{margin:12px;padding:23px}h1{font-size:2rem}}</style></head><body><main><small>LADY INTERACTIVA · ACTIVIDAD DE EJEMPLO</small><h1>Pequeñas acciones, gran planeta</h1><p>Ciencias · Primaria</p><p>Elige una respuesta, lee la explicación y sigue explorando.</p><div id="game"></div><footer>Demostración para la biblioteca de la profe Lady. Funciona sin conexión después de descargarla.</footer></main><script>const data=[["¿Qué ayuda a ahorrar agua mientras te cepillas?",["Dejar el grifo abierto","Cerrar el grifo mientras cepillas","Usar más jabón"],1,"Cerrar el grifo mientras no necesitas agua evita desperdiciarla."],["Una hoja tiene una cara sin usar. ¿Qué puedes hacer?",["Usarla para dibujar","Desecharla de inmediato","Mojarla"],0,"Reutilizar materiales reduce residuos."],["¿Qué necesitas saber antes de separar residuos?",["El color de mi mochila","Las reglas de separación de mi localidad","La temperatura de hoy"],1,"Las reglas de separación pueden variar. Consulta las de tu colegio o localidad."]];let index=0,score=0,answered=false;const box=document.getElementById('game');function show(){answered=false;box.replaceChildren();if(index===data.length){box.innerHTML='<h2>¡Misión completada!</h2><p>Respuestas correctas: '+score+' de '+data.length+'. Cada intento es una oportunidad de aprender.</p><button class="next" id="restart">Volver a jugar</button>';document.getElementById('restart').onclick=()=>{index=0;score=0;show()};return;}const q=data[index];box.innerHTML='<p>Pregunta '+(index+1)+' de '+data.length+'</p><progress value="'+index+'" max="'+data.length+'"></progress><h2>'+q[0]+'</h2><div class="answers"></div><div id="feedback" role="status"></div>';q[1].forEach((answer,n)=>{const b=document.createElement('button');b.textContent=answer;b.onclick=()=>{if(answered)return;answered=true;if(n===q[2])score++;box.querySelectorAll('.answers button').forEach(x=>x.disabled=true);const f=document.getElementById('feedback');f.className='feedback';f.textContent=(n===q[2]?'¡Correcto! ':'Vamos a descubrirlo: ')+q[3];const next=document.createElement('button');next.className='next';next.textContent=index===data.length-1?'Ver resultado':'Siguiente pregunta';next.onclick=()=>{index++;show()};box.append(next);next.focus()};box.querySelector('.answers').append(b)})}show();</script></body></html>
